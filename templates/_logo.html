{# מונוגרמה וקטורית של "אור הבזק" — אותיות א+ב משולבות עם חריץ בזק (ברק).
   פרמטרים: size (פיקסלים), variant ('dark' לרקע כהה / 'light' לרקע בהיר) #}
{% set s = size|default(40) %}
{% set v = variant|default('light') %}
<svg class="logo-badge" width="{{ s }}" height="{{ s }}" viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="אור הבזק">
  <defs>
    <linearGradient id="ohb-g-{{ v }}" x1="0" y1="0" x2="48" y2="48" gradientUnits="userSpaceOnUse">
      <stop stop-color="#16D6F0"/>
      <stop offset="1" stop-color="#00A6C4"/>
    </linearGradient>
  </defs>
  {% if v == 'dark' %}
    <rect x="2" y="2" width="44" height="44" rx="12" fill="url(#ohb-g-dark)"/>
    {% set fg = '#0B1220' %}
  {% else %}
    <rect x="2" y="2" width="44" height="44" rx="12" fill="#0E1B2E"/>
    <rect x="2" y="2" width="44" height="44" rx="12" stroke="url(#ohb-g-light)" stroke-width="1.5"/>
    {% set fg = '#16D6F0' %}
  {% endif %}
  {# חריץ ברק אלכסוני #}
  <path d="M27 9 L17 25 L23 25 L20 39 L31 21 L25 21 Z" fill="{{ fg }}" {% if v=='dark' %}opacity="0.92"{% endif %}/>
  {# נקודת הדגשה #}
  <circle cx="34" cy="14" r="2.4" fill="{{ fg }}" opacity="0.6"/>
</svg>
